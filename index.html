<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zitao Li | Personal homepage</title>


  <style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    padding: 100px 24px;

    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    color: white;
    text-align: center;


    background-image:
      linear-gradient(
        rgba(0, 0, 0, 0.35),
        rgba(0, 0, 0, 0.65)
      ),
      url("images/cover.jpg");

    background-color: #26312e;
    background-size: cover;
    background-position: center;

    
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  h1 {
    
    font-family: "Bodoni 72", "Bodoni MT", Didot, serif;
    font-size: clamp(64px, 9vw, 112px);
    font-weight: 400;
    line-height: 1.3;
    letter-spacing: normal;
    max-width: 1000px;
    margin: 0 0 24px;
    text-wrap: balance;
  }

  p {
    
    font-family: "Times New Roman", Times, serif;
    font-size: clamp(15px, 1.5vw, 18px);
    font-weight: 400;
    color: rgba(255, 255, 255, 0.75);
    line-height: 1.8;
    letter-spacing: 0.015em;
    max-width: 600px;
    margin: 0 0 36px;
  }

  .enter-link {
    display: inline-block;
    text-decoration: none;
    background: white;
    color: #17211d;
    font: inherit;
    font-weight: 600;
    padding: 14px 28px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .enter-link:hover {
    background: #dfe9e2;
  }

  .enter-link:focus-visible {
    outline: 3px solid white;
    outline-offset: 5px;
  }
</style>
</head>

<body>
  <h1>Zitao Li</h1>
  <p id="message">Master of Science, Geographic Information Science and Technology</p>
  <a class="enter-link" href="about.html">Enter</a>
</body>
</html>
